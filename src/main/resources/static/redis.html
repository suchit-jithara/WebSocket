<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Redis Chat</title>

    <!-- SockJS + STOMP libraries -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

    <style>
        body { font-family: Arial; padding: 20px; }
        #messages {
            width: 100%;
            height: 300px;
            border: 1px solid #888;
            padding: 10px;
            overflow-y: auto;
        }
        #msg { width: 80%; padding: 8px; }
        #sendBtn { padding: 10px; }
    </style>
</head>
<body>

<h2>Spring Boot + WebSocket + Redis PubSub Chat</h2>

<div>
    <label>Your Name: </label>
    <input type="text" id="username" placeholder="Enter name" />
    <button onclick="connect()">Connect</button>
</div>

<hr>

<h3>Messages</h3>
<div id="messages"></div>

<br>

<input type="text" id="msg" placeholder="Type a message..." />
<button id="sendBtn" onclick="sendMessage()">Send</button>

<script>
    let stompClient = null;
    let username = null;

    function connect() {
        username = document.getElementById("username").value;

        if (!username) {
            alert("Enter your name first!");
            return;
        }

        const socket = new SockJS(window.location.origin + "/chat");
        stompClient = Stomp.over(socket);

        stompClient.connect({}, function () {

            console.log("Connected to WebSocket");

            // SUBSCRIBE to topic
            stompClient.subscribe("/topic/messages", function (message) {
                showMessage(JSON.parse(message.body));
            });

            showMessage({ from: "SYSTEM", message: username + " joined the chat" });
        });
        console.log(window.location.origin);
    }

    function sendMessage() {
        const messageContent = document.getElementById("msg").value;

        if (!messageContent) return;

        const chatMessage = {
            from: username,
            message: messageContent
        };

        stompClient.send("/app/chat.send", {}, JSON.stringify(chatMessage));

        document.getElementById("msg").value = "";
    }

    function showMessage(message) {
        const messageArea = document.getElementById("messages");
        const p = document.createElement("p");
        p.textContent = message.from + ": " + message.message;
        messageArea.appendChild(p);
    }
</script>

</body>
</html>
